<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | BorrowBox</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="dashboard.html" class="brand-logo">BorrowBox <span class="brand-badge">Student Lending</span></a>
      <nav><ul class="nav-links"></ul></nav>
    </div>
  </header>
  <main class="main-content">
    <div class="container form-page-container">
      <div class="page-header-block">
        <h1 class="page-title">Create your account</h1>
        <p class="page-subtitle">Join BorrowBox to list items and request to borrow from other students.</p>
      </div>
      <div id="formMessage" class="alert" style="display:none" role="status"></div>
      <div class="form-card">
        <form id="registerForm">
          <div class="form-group">
            <label for="name" class="form-label">Full name</label>
            <input id="name" name="name" type="text" class="form-control" maxlength="120" autocomplete="name" required>
          </div>
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input id="email" name="email" type="email" class="form-control" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input id="password" name="password" type="password" class="form-control" minlength="8" autocomplete="new-password" required>
            <p class="form-hint">Use at least 8 characters.</p>
          </div>
          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" minlength="8" autocomplete="new-password" required>
          </div>
          <div class="form-actions"><button type="submit" class="btn btn-primary">Create Account</button></div>
        </form>
        <p class="auth-switch">Already registered? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </main>
  <footer class="site-footer"><div class="container footer-content"><p>BorrowBox &bull; University of San Carlos</p></div></footer>
  <script src="js/script.js"></script>
</body>
</html>
